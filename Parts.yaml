# --- Servos & control ---

ST3215_Servo:
    Name: ST3215 serial bus servo
    Description: >
        12 V, 30 kg·cm serial bus servo. Three per leg (18 in total), plus
        optional spares. Each servo comes with one 3-pin cable and horn screws.
    Specs:
        Model: ST3215
        Voltage: 12 V
        Torque: 30 kg·cm
        Interface: Serial bus
    Suppliers:
        DFRobot:
            PartNo: 'ST3215'
            Link: https://www.dfrobot.com/product-2962.html

BusServoAdapterA:
    Name: Waveshare Bus Servo Adapter (A)
    Description: >
        USB/UART to serial servo bus adapter. Mounts on the Pi shelf.
    Specs:
        Manufacturer: Waveshare
        Interface: USB / UART to servo bus
    Suppliers:
        The Pi Hut:
            PartNo: 'Bus Servo Adapter (A)'
            Link: https://thepihut.com/products/serial-bus-servo-driver-board

